name: 병렬 작업 티켓
description: 두 사용자 계정과 Codex 세션 사이에서 작업을 선점하고 파일 소유권을 기록합니다.
title: "[TASK] "
labels:
  - "status:ready"
body:
  - type: input
    id: task_id
    attributes:
      label: 작업 ID
      description: Issue, 브랜치와 진행 댓글에서 함께 사용할 고유 ID
      placeholder: CG-03
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - combat
        - graphics
        - progression
        - save
        - ui
        - integration
        - qa
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0
        - P1
        - P2
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: 작업 브랜치 또는 fork 브랜치
      placeholder: codex/cg-03-save
    validations:
      required: true
  - type: textarea
    id: owned_paths
    attributes:
      label: 소유 경로
      description: 이 작업만 수정할 수 있는 파일 또는 폴더
      placeholder: app/game/**, tests/**
    validations:
      required: true
  - type: textarea
    id: readonly_paths
    attributes:
      label: 읽기 전용 경로
      description: 참고할 수 있지만 수정하면 안 되는 범위
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 선행 작업과 기준 커밋
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 테스트와 인계 조건까지 체크 가능한 형태로 작성합니다.
    validations:
      required: true
  - type: checkboxes
    id: claim_check
    attributes:
      label: 선점 확인
      options:
        - label: 진행 중인 Issue와 열린 PR을 확인했고 수정 경로가 겹치지 않습니다.
          required: true
        - label: 작업 시작 시 이 이슈를 자기 계정에 할당하고 status:in-progress로 변경하겠습니다.
          required: true
